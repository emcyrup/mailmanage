<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新規登録 — mailmanage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-box">
    <h1>📬 mailmanage</h1>
    <p class="login-lead" id="signup-lead">ユーザー登録</p>
    <form id="signup-form">
      <label>ユーザー名
        <input type="text" name="username" required autofocus autocomplete="username"
               pattern="[a-zA-Z0-9._\-]{3,32}" title="3〜32文字の英数字・ピリオド・ハイフン・アンダースコア" />
      </label>
      <label>パスワード(8文字以上)
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
      </label>
      <label>パスワード(確認)
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password" />
      </label>
      <label id="invite-label" class="hidden">招待コード
        <input type="text" name="invite" autocomplete="off" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">登録</button>
      <p class="error hidden" id="signup-error"></p>
    </form>
    <p class="switch-link">すでにアカウントがある場合は <a href="/login.html">ログイン</a></p>
  </main>
  <script src="signup.js"></script>
</body>
</html>
