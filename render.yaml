# Render (https://render.com) 用の Blueprint。
# ダッシュボードで MAILMANAGE_INVITE_CODE を設定すること(推奨)。
services:
  - type: web
    name: mailmanage
    runtime: node
    plan: starter # ディスク永続化には有料プランが必要
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /login.html
    envVars:
      - key: MAILMANAGE_INVITE_CODE
        sync: false # ダッシュボードで手動設定
      - key: MAILMANAGE_SECRET
        generateValue: true
      # Outlook 連携(Microsoft OAuth)を使う場合のみ設定
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false # 例: https://mailmanage.onrender.com
    disk:
      name: mailmanage-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
