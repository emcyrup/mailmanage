services:
  mailmanage:
    # GitHub Actions が公開するビルド済みイメージを使う。
    # ソースからビルドする場合は image をコメントアウトして build を有効化。
    image: ghcr.io/emcyrup/mailmanage:latest
    # build: .
    ports:
      - "3000:3000"
    environment:
      # 必ず自分の値に変更すること
      MAILMANAGE_INVITE_CODE: "change-me-invite-code"
      MAILMANAGE_SECRET: "change-me-long-random-string"
    volumes:
      - mailmanage-data:/app/data
    restart: unless-stopped

volumes:
  mailmanage-data:
